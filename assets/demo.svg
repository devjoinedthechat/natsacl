<svg xmlns="http://www.w3.org/2000/svg" width="780" height="318" viewBox="0 0 780 318" role="img" aria-label="Terminal: natsacl compile, check and explain">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="760" height="298" rx="14" fill="#0b1220" filter="url(#s)"/>
  <rect x="10" y="10" width="760" height="38" rx="14" fill="#111a2e"/>
  <rect x="10" y="34" width="760" height="14" fill="#111a2e"/>
  <circle cx="34" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="29" r="6" fill="#febc2e"/>
  <circle cx="74" cy="29" r="6" fill="#28c840"/>
  <text x="390" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">natsacl — examples/ingest-alerts</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" xml:space="preserve">
    <text x="34" y="78"><tspan fill="#2dd4bf">$</tspan><tspan fill="#f1f5f9"> natsacl compile</tspan></text>
    <text x="34" y="100" fill="#cbd5e1">wrote nats/auth.conf (server, 2 user(s))</text>
    <text x="34" y="138"><tspan fill="#2dd4bf">$</tspan><tspan fill="#f1f5f9"> natsacl check</tspan></text>
    <text x="34" y="160" fill="#cbd5e1">nats/auth.conf is up to date (2 user(s)).</text>
    <text x="34" y="198"><tspan fill="#2dd4bf">$</tspan><tspan fill="#f1f5f9"> natsacl explain alerts-svc INCIDENTS.opened</tspan></text>
    <text x="34" y="220" fill="#cbd5e1">alerts-svc may publish INCIDENTS.opened via <tspan fill="#fde68a">"INCIDENTS.opened"</tspan></text>
    <text x="34" y="242" fill="#94a3b8">  js-publish "INCIDENTS.opened" at <tspan fill="#7dd3fc">src/alerts/incidents.ts:17:11</tspan> [template]</text>
    <text x="34" y="264" fill="#cbd5e1">alerts-svc may <tspan fill="#fca5a5">NOT</tspan> subscribe INCIDENTS.opened</text>
    <text x="34" y="294"><tspan fill="#2dd4bf">$</tspan><tspan fill="#f1f5f9"> </tspan><tspan fill="#f1f5f9">▍</tspan></text>
  </g>
</svg>
